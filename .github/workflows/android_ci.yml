name: VaultX Android CI & Release Readiness

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality-and-tests:
    name: Quality Gate, Unit Tests & Release Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle with Dependency & Configuration Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Code Style Check (Spotless / Ktlint)
        run: ./gradlew spotlessCheck --stacktrace

      - name: Run Unit Tests (JUnit 5 + Pure JVM & Android Modules)
        run: ./gradlew :core:model:test testDebugUnitTest --stacktrace

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/testDebugUnitTest/
            **/build/reports/tests/test/
          retention-days: 7

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Android Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: "**/build/reports/lint-results-debug.*"
          retention-days: 7

      - name: Assemble Release App Bundle (R8 Minification & Resource Shrinking)
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Release AAB & R8 Mapping Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaultx-release-bundle
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
